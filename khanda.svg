<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD76A"/>
      <stop offset="1" stop-color="#E08A00"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#1E4FA3"/>
      <stop offset="1" stop-color="#0B1F4D"/>
    </radialGradient>
  </defs>

  <!-- Background disc (keeps it visible in light and dark mode) -->
  <circle cx="100" cy="100" r="98" fill="url(#bg)" stroke="#F5A623" stroke-width="3"/>

  <g fill="url(#gold)" stroke="none">
    <!-- Left kirpan -->
    <path d="M72 172 C24 138 22 66 68 26 C48 66 54 128 86 160 Z"/>
    <!-- Right kirpan (mirrored copy) -->
    <path d="M128 172 C176 138 178 66 132 26 C152 66 146 128 114 160 Z"/>

    <!-- Central double-edged sword -->
    <path d="M100 12 L108 42 L108 146 L100 162 L92 146 L92 42 Z"/>
    <!-- Guard, handle, pommel -->
    <rect x="86" y="152" width="28" height="6" rx="3"/>
    <rect x="96" y="158" width="8" height="22" rx="3"/>
    <circle cx="100" cy="184" r="4"/>

    <!-- Chakkar -->
    <circle cx="100" cy="98" r="34" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <circle cx="100" cy="98" r="26" fill="none" stroke="url(#gold)" stroke-width="2"/>
  </g>

  <!-- Blade centre line -->
  <line x1="100" y1="20" x2="100" y2="146" stroke="#0B1F4D" stroke-width="1.5" opacity=".6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
