<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD76A"/>
      <stop offset="1" stop-color="#E08A00"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)" fill="url(#gold)" stroke="none">
    <!-- Left kirpan (curved sword) -->
    <path id="kirpan" d="M70 182 C14 142 12 62 64 16 C42 62 48 128 84 168 Z"/>
    <!-- Right kirpan (mirrored) -->
    <use href="#kirpan" transform="translate(200,0) scale(-1,1)"/>

    <!-- Central double-edged sword -->
    <path d="M100 6 L109 40 L109 150 L100 168 L91 150 L91 40 Z"/>
    <!-- Hilt guard + handle -->
    <rect x="84" y="158" width="32" height="6" rx="3"/>
    <rect x="96" y="164" width="8" height="26" rx="3"/>
    <circle cx="100" cy="193" r="4"/>

    <!-- Chakkar (circle) -->
    <circle cx="100" cy="100" r="36" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <circle cx="100" cy="100" r="27" fill="none" stroke="url(#gold)" stroke-width="2"/>
  </g>

  <!-- Centre line of blade -->
  <line x1="100" y1="14" x2="100" y2="150" stroke="#0B1F4D" stroke-width="1.5" opacity=".6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
