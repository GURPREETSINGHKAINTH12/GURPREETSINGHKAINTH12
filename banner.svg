<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1F4D"/>
      <stop offset="0.6" stop-color="#1E4FA3"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#E08A00"/>
    </linearGradient>
    <g id="sword">
      <polygon points="0,-78 7,-60 7,42 -7,42 -7,-60" fill="url(#gold)"/>
      <rect x="-24" y="42" width="48" height="7" rx="3" fill="url(#gold)"/>
      <rect x="-5" y="49" width="10" height="26" rx="3" fill="url(#gold)"/>
      <circle cx="0" cy="80" r="6" fill="url(#gold)"/>
    </g>
  </defs>

  <rect width="1000" height="260" rx="14" fill="url(#sky)"/>

  <!-- Crossed swords, left and right -->
  <g transform="translate(110,130) scale(1.25)">
    <use href="#sword" xlink:href="#sword" transform="rotate(40)" xmlns:xlink="http://www.w3.org/1999/xlink"/>
    <use href="#sword" xlink:href="#sword" transform="rotate(-40)" xmlns:xlink="http://www.w3.org/1999/xlink"/>
  </g>
  <g transform="translate(890,130) scale(1.25)">
    <use href="#sword" xlink:href="#sword" transform="rotate(40)" xmlns:xlink="http://www.w3.org/1999/xlink"/>
    <use href="#sword" xlink:href="#sword" transform="rotate(-40)" xmlns:xlink="http://www.w3.org/1999/xlink"/>
  </g>

  <text x="500" y="125" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#FFFFFF" letter-spacing="2">GURPREET SINGH KAINTH</text>
  <line x1="300" y1="148" x2="700" y2="148" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  <text x="500" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFD76A" letter-spacing="3">B.TECH CSE STUDENT  •  DEVELOPER IN THE MAKING</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
